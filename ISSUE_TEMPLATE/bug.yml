name: Bug report
description: Report a reproducible problem without secrets or personal data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Report security vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain the impact and what should have happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the environment and version; sanitize all evidence.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe supporting evidence
      description: Redacted logs or screenshots only. Never include tokens, cookies or personal data.
